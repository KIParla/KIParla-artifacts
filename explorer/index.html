<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KIParla Corpus Explorer</title>
<style>
/* Tokens follow the KIParla-artifacts site (paper ground, serif headings, teal accent). */
:root {
  --bg: #f4f1ea; --panel: #fffdf8; --ink: #1f1f1c; --muted: #5f625b; --line: #d9d2c4;
  --accent: #0f6c5c; --accent-soft: #dcefe9; --ghost: #d9d2c4; --warn: #9a4a12;
  --serif: Georgia, "Times New Roman", serif;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --ph: 0.15; /* opacity of points outside the selection */
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #171a18; --panel: #1f2321; --ink: #e8e6df; --muted: #a2a79f; --line: #353b37;
    --accent: #5fc3ab; --accent-soft: #1f3a33; --ghost: #3a413d; --warn: #e0a06a; --ph: 0.22;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #171a18; --panel: #1f2321; --ink: #e8e6df; --muted: #a2a79f; --line: #353b37;
  --accent: #5fc3ab; --accent-soft: #1f3a33; --ghost: #3a413d; --warn: #e0a06a; --ph: 0.22;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 var(--sans); }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--serif); font-weight: 600; margin: 0; line-height: 1.15; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---- page frame ---- */
.top { padding: 22px 16px 14px; max-width: 1480px; margin: 0 auto; display: flex; gap: 16px; align-items: end; justify-content: space-between; flex-wrap: wrap; }
.top h1 { font-size: clamp(26px, 4vw, 38px); letter-spacing: -0.02em; }
.top p { margin: 6px 0 0; max-width: 62ch; color: var(--muted); }
.top nav { display: flex; gap: 14px; font-size: 13px; }
.layout { max-width: 1480px; margin: 0 auto; padding: 0 16px 48px; display: grid; grid-template-columns: 330px minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 920px) { .layout { grid-template-columns: minmax(0, 1fr); } }

/* ---- filters ---- */
#filters { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; position: sticky; top: 8px; max-height: calc(100vh - 16px); overflow: auto; }
@media (max-width: 920px) { #filters { position: static; max-height: none; } #filters:not(.open) .fbody { display: none; } }
.fhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--panel); z-index: 2; }
.fhead h2 { font-size: 17px; }
.fhead button { border: 1px solid var(--line); background: none; border-radius: 4px; padding: 3px 9px; }
.ftoggle { display: none; }
@media (max-width: 920px) { .ftoggle { display: inline-block; } }
.group { padding: 10px 12px 2px; font: 600 11px var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.search { padding: 10px 12px 6px; }
.search input { width: 100%; padding: 6px 8px; border: 1px solid var(--line); border-radius: 4px; background: var(--bg); }
details.fs, details.rg { border-bottom: 1px solid var(--line); }
details.fs > summary, details.rg > summary { list-style: none; cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 12px; }
details > summary::-webkit-details-marker { display: none; }
details.fs > summary::before, details.rg > summary::before { content: "+"; width: 14px; color: var(--muted); font-family: var(--mono); }
details[open].fs > summary::before, details[open].rg > summary::before { content: "–"; }
summary .t { flex: 1; }
.badge { font: 600 11px var(--mono); background: var(--accent); color: var(--bg); border-radius: 9px; padding: 0 7px; }
.opts { padding: 0 12px 10px; max-height: 210px; overflow: auto; }
.opt { display: flex; align-items: baseline; gap: 7px; padding: 2px 0; cursor: pointer; }
.opt input { margin: 0; accent-color: var(--accent); }
.opt .v { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.opt .n { font: 12px var(--mono); color: var(--muted); }
.opt.zero .v, .opt.zero .n { opacity: .45; }
.seg { display: flex; margin: 4px 12px 8px; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
.seg button { flex: 1; border: 0; background: none; padding: 4px 6px; font-size: 12.5px; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--bg); }
.rbody { padding: 0 12px 12px; }
.hist { position: relative; height: 46px; }
.hist svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.slider { position: absolute; left: 0; right: 0; bottom: -8px; height: 16px; }
.slider input[type=range] { position: absolute; left: 0; width: 100%; margin: 0; height: 16px; background: none; pointer-events: none; -webkit-appearance: none; appearance: none; }
.slider input[type=range]::-webkit-slider-runnable-track { height: 2px; background: transparent; }
.slider input[type=range]::-moz-range-track { height: 2px; background: transparent; }
.slider input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; pointer-events: auto; width: 13px; height: 13px; margin-top: -6px; border-radius: 50%; background: var(--panel); border: 2px solid var(--accent); }
.slider input[type=range]::-moz-range-thumb { pointer-events: auto; width: 9px; height: 9px; border-radius: 50%; background: var(--panel); border: 2px solid var(--accent); }
.nums { display: flex; align-items: center; gap: 6px; margin-top: 14px; }
.nums input { width: 4.6em; padding: 3px 5px; border: 1px solid var(--line); border-radius: 4px; background: var(--bg); font: 12.5px var(--mono); }
.nums .u { color: var(--muted); font-size: 12px; }
.rg .desc { color: var(--muted); font-size: 12px; margin: 0 0 6px; }

/* ---- main ---- */
main { min-width: 0; display: grid; gap: 14px; }
.selbar { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px; display: flex; flex-wrap: wrap; gap: 8px 26px; align-items: baseline; }
.selbar .big { font: 600 26px var(--mono); letter-spacing: -0.02em; }
.selbar .of { color: var(--muted); font: 13px var(--mono); }
.selbar .fig { display: flex; flex-direction: column; }
.selbar .fig span:first-child { font: 600 11px var(--sans); letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.selbar .fig span:last-child { font: 600 17px var(--mono); }
.selbar .actions { margin-left: auto; display: flex; gap: 8px; align-self: center; }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 4px; padding: 5px 11px; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--bg); border-color: var(--accent); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--accent); background: var(--accent-soft); border-radius: 13px; padding: 1px 4px 1px 10px; font-size: 12.5px; }
.chip button { border: 0; background: none; padding: 0 5px; color: var(--muted); font-size: 15px; line-height: 1; }
.chip button:hover { color: var(--ink); }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tabs button { border: 0; background: none; padding: 8px 14px; border-bottom: 3px solid transparent; color: var(--muted); white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 16px; min-width: 0; }
.panel h2 { font-size: 20px; margin-bottom: 10px; }
.panel h3 { font-size: 15px; margin: 18px 0 8px; }
.empty { padding: 28px 8px; color: var(--muted); text-align: center; }
table { border-collapse: collapse; width: 100%; }
th, td { text-align: left; padding: 5px 10px 5px 0; border-bottom: 1px solid var(--line); vertical-align: baseline; }
th { font: 600 11.5px var(--sans); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
td.r, th.r { text-align: right; }
#panel td:nth-child(3) { white-space: nowrap; }
.scroll { overflow-x: auto; }
.fig-table td:first-child { color: var(--muted); }
.fig-table td { font-family: var(--mono); }
.fig-table td:first-child { font-family: var(--sans); }
.delta { color: var(--muted); font-size: 12px; }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 6px 28px; }
.bars h4 { margin: 14px 0 6px; font: 600 12px var(--sans); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.bar { display: grid; grid-template-columns: minmax(90px, 42%) 1fr auto; gap: 8px; align-items: center; padding: 1.5px 0; }
.bar .lab { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar .track { position: relative; height: 11px; }
.bar .ghost { position: absolute; inset: 0 auto 0 0; background: var(--ghost); border-radius: 1px; }
.bar .fill { position: absolute; inset: 0 auto 0 0; background: var(--accent); border-radius: 1px; }
.bar .cnt { font: 12px var(--mono); color: var(--muted); white-space: nowrap; }
.legend { display: flex; gap: 14px; color: var(--muted); font-size: 12px; margin: 4px 0 0; flex-wrap: wrap; }
.legend i { display: inline-block; width: 10px; height: 10px; margin-right: 5px; vertical-align: -1px; }
.ctrl { display: flex; flex-wrap: wrap; gap: 10px 18px; margin-bottom: 8px; }
.ctrl label { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; }
.ctrl select { padding: 3px 6px; border: 1px solid var(--line); border-radius: 4px; background: var(--bg); }
svg.plot { width: 100%; height: auto; display: block; touch-action: none; }
svg.plot text { fill: var(--muted); font: 11px var(--mono); }
svg.plot .axis { stroke: var(--line); }
svg.plot .grid { stroke: var(--line); stroke-dasharray: 2 3; opacity: .7; }
svg.plot circle { stroke: var(--panel); stroke-width: .6; }
svg.plot circle.out { opacity: var(--ph); }
svg.plot .brush { fill: var(--accent); fill-opacity: .12; stroke: var(--accent); }
#tip { position: fixed; z-index: 10; background: var(--ink); color: var(--bg); padding: 5px 9px; border-radius: 4px; font: 12px var(--mono); pointer-events: none; display: none; max-width: 280px; }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; }
td .rm { border: 1px solid var(--line); background: none; border-radius: 3px; padding: 0 6px; color: var(--muted); }
td .rm:hover { color: var(--warn); border-color: var(--warn); }
th button { border: 0; background: none; padding: 0; font: inherit; letter-spacing: inherit; text-transform: inherit; color: inherit; }
th[aria-sort] button { color: var(--ink); }
.fmt { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 4px 16px; margin: 6px 0 14px; }
.fmt label { display: flex; gap: 7px; align-items: center; }
.fmt input { accent-color: var(--accent); }
.actions-row { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; }
pre { background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 10px; overflow: auto; max-height: 260px; font: 12px/1.45 var(--mono); }
.note { color: var(--muted); max-width: 72ch; margin: 6px 0; }
.notice { color: var(--warn); }
dl.defs { margin: 8px 0 0; display: grid; grid-template-columns: max-content 1fr; gap: 3px 14px; }
dl.defs dt { font-weight: 600; } dl.defs dd { margin: 0; color: var(--muted); }
footer { max-width: 1480px; margin: 0 auto; padding: 0 16px 36px; color: var(--muted); font-size: 12.5px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
</style>
</head>
<body>
<header class="top">
  <div>
    <h1>KIParla Corpus Explorer</h1>
    <p>Filter the conversations of the seven KIParla modules by metadata, speakers and measured features, see what the resulting sub-corpus contains, and export it.</p>
  </div>
  <nav aria-label="Related"><a href="../index.html">Transcriptions</a><a href="https://search.corpuskiparla.it/">Search the corpus</a></nav>
</header>

<div class="layout">
  <aside id="filters" aria-label="Filters">
    <div class="fhead">
      <h2>Filters</h2>
      <span>
        <button type="button" id="reset">Reset</button>
        <button type="button" class="ftoggle" id="ftoggle" aria-expanded="false">Show</button>
      </span>
    </div>
    <div class="fbody" id="fbody"></div>
  </aside>

  <main>
    <section class="selbar" id="selbar" aria-live="polite" aria-label="Current selection"></section>
    <div class="chips" id="chips"></div>
    <div class="tabs" role="tablist" id="tabs">
      <button role="tab" data-tab="overview" aria-selected="true">Overview</button>
      <button role="tab" data-tab="explore" aria-selected="false">Explore</button>
      <button role="tab" data-tab="table" aria-selected="false">Conversations</button>
      <button role="tab" data-tab="export" aria-selected="false">Export</button>
    </div>
    <section class="panel" id="panel" role="tabpanel"></section>
  </main>
</div>
<footer id="foot"></footer>
<div id="tip" role="tooltip"></div>

<script>/* KIParla explorer — filtering and statistics (no DOM). Tested under Node
 * (tests/explorer_core.test.js); inlined into the page by build_explorer.py. */
(function (root, factory) {
  if (typeof module === "object" && module.exports) module.exports = factory();
  else root.KiparlaCore = factory();
})(typeof self !== "undefined" ? self : this, function () {
  "use strict";

  var UNKNOWN = "unknown";

  /* ---------------------------------------------------------------- state */

  function emptyState() {
    return { q: "", cat: {}, spk: {}, spkMode: "any", num: {}, exclude: [] };
  }

  function isActive(state) {
    return !!(state.q || (state.exclude && state.exclude.length) ||
      Object.keys(state.cat).some(function (k) { return state.cat[k].length; }) ||
      Object.keys(state.spk).some(function (k) { return state.spk[k].length; }) ||
      Object.keys(state.num).length);
  }

  /* ------------------------------------------------------------- indexing */

  function splitMulti(v) {
    return String(v).split(";").map(function (x) { return x.trim(); })
      .filter(function (x) { return x && x !== "_" && x !== "N/A"; });
  }

  function valuesOf(record, facet) {
    var v = facet.id === "module" ? record.modules : record[facet.id];
    if (v === null || v === undefined || v === "") return [UNKNOWN];
    if (Array.isArray(v)) return v.length ? v : [UNKNOWN];
    if (facet.multi) {
      var parts = splitMulti(v);
      return parts.length ? parts : [UNKNOWN];
    }
    return [String(v)];
  }

  function buildIndex(data) {
    var convFacets = [{ id: "module", label: "Module", multi: true }]
      .concat(data.conversation_facets.filter(function (f) { return f.id !== "module"; }));
    var spkByConv = {};
    data.speakers.forEach(function (s) {
      if (!s.known) return;
      (spkByConv[s.conv] = spkByConv[s.conv] || []).push(s);
    });
    var domains = {};
    data.metrics.forEach(function (m) {
      var vals = data.conversations.map(function (c) { return c[m.id]; })
        .filter(function (v) { return v !== null && v !== undefined; });
      domains[m.id] = [Math.min.apply(null, vals), Math.max.apply(null, vals)];
    });
    return {
      data: data, convFacets: convFacets, spkFacets: data.speaker_facets,
      metrics: data.metrics, spkByConv: spkByConv, domains: domains,
    };
  }

  /* ------------------------------------------------------------ filtering */

  function matchCat(ix, c, state, skip) {
    return ix.convFacets.every(function (f) {
      var want = state.cat[f.id];
      if (!want || !want.length || skip === "cat:" + f.id) return true;
      var have = valuesOf(c, f);
      return want.some(function (w) { return have.indexOf(w) >= 0; });
    });
  }

  function matchSpk(ix, c, state, skip) {
    var spk = ix.spkByConv[c.code] || [];
    return ix.spkFacets.every(function (f) {
      var want = state.spk[f.id];
      if (!want || !want.length || skip === "spk:" + f.id) return true;
      var test = function (s) {
        var have = valuesOf(s, f);
        return want.some(function (w) { return have.indexOf(w) >= 0; });
      };
      if (!spk.length) return false;
      return state.spkMode === "all" ? spk.every(test) : spk.some(test);
    });
  }

  function matchNum(ix, c, state, skip) {
    return ix.metrics.every(function (m) {
      var r = state.num[m.id];
      if (!r || skip === "num:" + m.id) return true;
      var v = c[m.id];
      if (v === null || v === undefined) return false;
      return (r[0] === null || v >= r[0]) && (r[1] === null || v <= r[1]);
    });
  }

  function matchQuery(ix, c, state) {
    var q = (state.q || "").trim().toLowerCase();
    if (!q) return true;
    var hay = [c.code].concat((ix.spkByConv[c.code] || []).map(function (s) { return s.spk; }))
      .join(" ").toLowerCase();
    return q.split(/\s+/).every(function (t) { return hay.indexOf(t) >= 0; });
  }

  /* `skip` leaves one facet/metric out, to count what its options would give. */
  function matches(ix, c, state, skip) {
    return matchCat(ix, c, state, skip) && matchSpk(ix, c, state, skip) &&
      matchNum(ix, c, state, skip) && matchQuery(ix, c, state);
  }

  /* The selection: conversations passing every filter, minus the ones
   * removed by hand (state.exclude). */
  function filter(ix, state) {
    var out = state.exclude || [];
    return ix.data.conversations.filter(function (c) {
      return out.indexOf(c.code) < 0 && matches(ix, c, state);
    });
  }

  /* Options of a facet with how many conversations each would select, given
   * every other filter. kind: "cat" (conversation) or "spk" (speaker). */
  function facetOptions(ix, state, kind, facetId) {
    var facet = (kind === "cat" ? ix.convFacets : ix.spkFacets)
      .filter(function (f) { return f.id === facetId; })[0];
    var counts = {};
    ix.data.conversations.forEach(function (c) {
      if (!matches(ix, c, state, kind + ":" + facetId)) return;
      var seen = {};
      if (kind === "cat") {
        valuesOf(c, facet).forEach(function (v) { seen[v] = true; });
      } else {
        (ix.spkByConv[c.code] || []).forEach(function (s) {
          valuesOf(s, facet).forEach(function (v) { seen[v] = true; });
        });
      }
      Object.keys(seen).forEach(function (v) { counts[v] = (counts[v] || 0) + 1; });
    });
    var all = {};
    (kind === "cat" ? ix.data.conversations : ix.data.speakers).forEach(function (r) {
      if (kind === "spk" && !r.known) return;
      valuesOf(r, facet).forEach(function (v) { all[v] = true; });
    });
    (state[kind][facetId] || []).forEach(function (v) { all[v] = true; });
    return Object.keys(all).sort(naturalOrder).map(function (v) {
      return { value: v, count: counts[v] || 0 };
    });
  }

  function naturalOrder(a, b) {
    if (a === UNKNOWN) return 1;
    if (b === UNKNOWN) return -1;
    return a.localeCompare(b, "en", { numeric: true });
  }

  /* ---------------------------------------------------------- statistics */

  function sum(arr, f) {
    return arr.reduce(function (t, x) { var v = f(x); return t + (v || 0); }, 0);
  }

  function median(values) {
    if (!values.length) return null;
    var s = values.slice().sort(function (a, b) { return a - b; });
    var m = s.length >> 1;
    return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2;
  }

  function describe(values) {
    var v = values.filter(function (x) { return x !== null && x !== undefined; });
    if (!v.length) return { n: 0, min: null, median: null, mean: null, max: null };
    return {
      n: v.length, min: Math.min.apply(null, v), median: median(v),
      mean: v.reduce(function (a, b) { return a + b; }, 0) / v.length,
      max: Math.max.apply(null, v),
    };
  }

  /* Figures of a selection. Shares are pooled (total overlap time over total
   * speech time, etc.), not averages of per-conversation percentages. */
  function summarise(ix, convs) {
    var speechH = sum(convs, function (c) { return c.speech_hours; });
    var ling = sum(convs, function (c) { return c.ling; });
    var overlapH = sum(convs, function (c) { return c.speech_hours * (c.overlap_pct || 0) / 100; });
    var annTok = sum(convs, function (c) { return c.ling * (c.ann_overlap_pct || 0) / 100; });
    var codes = {};
    convs.forEach(function (c) { codes[c.code] = true; });
    var people = {};
    ix.data.speakers.forEach(function (s) {
      if (s.known && codes[s.conv]) people[s.spk] = true;
    });
    var perMetric = {};
    ix.metrics.forEach(function (m) {
      perMetric[m.id] = describe(convs.map(function (c) { return c[m.id]; }));
    });
    return {
      conversations: convs.length,
      speakers: Object.keys(people).length,
      hours: sum(convs, function (c) { return c.hours; }),
      speechHours: speechH,
      tokens: sum(convs, function (c) { return c.tokens; }),
      ling: ling,
      units: sum(convs, function (c) { return c.units; }),
      overlapShare: speechH ? overlapH / speechH : null,
      annOverlapShare: ling ? annTok / ling : null,
      rate: speechH ? ling / (speechH * 3600) : null,
      perMetric: perMetric,
    };
  }

  /* Counts of conversations (kind "cat") or distinct speakers (kind "spk")
   * per value of a facet, within a selection. */
  function breakdown(ix, convs, kind, facetId) {
    var facet = (kind === "cat" ? ix.convFacets : ix.spkFacets)
      .filter(function (f) { return f.id === facetId; })[0];
    var counts = {};
    if (kind === "cat") {
      convs.forEach(function (c) {

  if (t.id === "distSel") { ui.dist = t.value; renderPanel(); }
  else if (t.id === "sx") { ui.sx = t.value; renderPanel(); }
  else if (t.id === "sy") { ui.sy = t.value; renderPanel(); }
  else if (t.id === "sc") { ui.color = t.value; renderPanel(); }
  else if (t.matches("input[data-fmt]")) { ui.formats[t.getAttribute("data-fmt")] = t.checked ? 1 : 0; updateScriptPreview(); }
}

/* ---------------------------------------------------------------- shell */
function renderPanel() {
  var p = $("#panel");
  p.innerHTML = tab === "overview" ? renderOverview() : tab === "explore" ? renderExplore() : tab === "table" ? renderTable() : renderExport();
  if (tab === "explore") bindScatter();
  if (tab === "export") updateScriptPreview();
  $$("#tabs button").forEach(function (b) { b.setAttribute("aria-selected", String(b.getAttribute("data-tab") === tab)); });
}
var persistTimer = null;
function persist() {
  clearTimeout(persistTimer);
  persistTimer = setTimeout(function () {
    try {
      var e = K.encodeState(state), parts = [];
      if (e) parts.push("s=" + e);
      if (tab !== "overview") parts.push("t=" + tab);
      history.replaceState(null, "", parts.length ? "#" + parts.join("&") : location.pathname + location.search);
    } catch (x) { /* storage or history unavailable: the page still works */ }
  }, 250);
}
function update() {
  sel = K.filter(ix, state);
  sum = K.summarise(ix, sel);
  updateSidebar(); renderSelBar(); renderChips(); renderPanel(); persist();
}
function init() {
  try {
    var m = /[#&]s=([^&]+)/.exec(location.hash), t = /[#&]t=(overview|explore|table|export)/.exec(location.hash);
    if (m) state = K.decodeState(m[1]);
    if (t) tab = t[1];
  } catch (x) {}
  buildSidebar();
  $("#fbody").addEventListener("input", onSidebar);
  $("#fbody").addEventListener("change", function (e) { if (e.target.matches("input[type=checkbox]")) onSidebar(e); });
  $("#fbody").addEventListener("click", function (e) { var b = e.target.closest("button[data-mode]"); if (b) { state.spkMode = b.getAttribute("data-mode"); update(); } });
  $("#reset").addEventListener("click", function () { state = K.emptyState(); update(); });
  $("#ftoggle").addEventListener("click", function () { var f = $("#filters"), o = f.classList.toggle("open"); this.textContent = o ? "Hide" : "Show"; this.setAttribute("aria-expanded", String(o)); });
  $("#chips").addEventListener("click", onChips);
  $("#tabs").addEventListener("click", function (e) { var b = e.target.closest("button[data-tab]"); if (b) { tab = b.getAttribute("data-tab"); renderPanel(); persist(); } });
  $("#selbar").addEventListener("click", function (e) {
    if (e.target.id === "goexport") { tab = "export"; renderPanel(); persist(); $("#tabs").scrollIntoView({ block: "start" }); }
    if (e.target.id === "copylink") { var b = e.target; copyText(location.href, function (ok) { b.textContent = ok ? "Link copied" : "Copy the address bar"; setTimeout(function () { b.textContent = "Copy link"; }, 1800); }); }
  });
  var p = $("#panel"); p.addEventListener("click", onPanel); p.addEventListener("change", onPanelChange);
  var src = Object.keys(DATA.sources).map(function (k) { return k + (DATA.sources[k] ? " v" + DATA.sources[k] : ""); }).join(" · ");
  var defs = DATA.metrics.map(function (m) { return "<dt>" + esc(m.label) + "</dt><dd>" + esc(m.description) + "</dd>"; }).join("");
  $("#foot").innerHTML = '<details><summary>How the numbers are computed</summary><p class="note">Every figure comes from the <code>summaries/</code> folder of each module, built from the vertical files with <code>summarize.py</code>. Speech time counts a speaker as soon as one of their units is active; overlap time is when two or more speakers are active at once. Overlap in tokens uses the overlaps the transcribers marked with brackets. Speaker attributes come from <code>participants.tsv</code>; tiers that are not listed there (unidentified speakers, <code>environment</code>) are left out of speaker counts and filters.</p><dl class="defs">' + defs + "</dl></details><p>Built from " + esc(src) + ".</p>";
  update();
}
init();
})();
</script>
</body>
