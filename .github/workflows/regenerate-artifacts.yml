# Flags that a module's published HTML/PDF pages need regenerating after its
# underlying data changed. Regeneration itself is a manual, local step
# (`tools/generate_artifacts.py`, see README.md): PDF export shells out to
# pandoc + xelatex (tools/linear2html.py), which is too heavy to run on a
# GitHub runner. Same pattern as the NoSketch recompile step.
#
# Triggered by `repository_dispatch: data-updated`, dispatched by
# KIParla-NoSketch-Data/.github/workflows/regenerate-on-release.yml after it
# regenerates that module's NoSketch corpus.
#   Payload: { module, tag }
#
# Files (or comments on, or reopens) one persistent REGENERATE_LABEL-tagged
# issue via .github/scripts/regenerate-issue.js. Each item carries the exact
# command to run, including --release-label / --release-url so the regenerated
# pages and PDFs cite the module release they came from.
#
# No secrets needed beyond the default GITHUB_TOKEN.

name: Flag artifacts for regeneration

on:
  repository_dispatch:
    types: [data-updated]

permissions:
  contents: read
  issues: write

env:
  REGENERATE_LABEL: needs-regeneration
  REGENERATE_ASSIGNEE: ellepannitto

jobs:
  flag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout KIParla-artifacts
        uses: actions/checkout@v4

      - name: File/update regeneration tracking issue
        uses: actions/github-script@v7
        env:
          MODULE: ${{ github.event.client_payload.module }}
          TAG: ${{ github.event.client_payload.tag }}
        with:
          script: |
            const { fileRegenerateItem } = require('./.github/scripts/regenerate-issue.js');
            const { MODULE, TAG } = process.env;
            const item = [
              `- [ ] \`${MODULE}\` @ \`${TAG}\``,
              "",
              "  ```bash",
              "  python3 tools/generate_artifacts.py \\",
              `    --module-root ${MODULE} \\`,
              "    --artifacts-root KIParla-artifacts \\",
              `    --release-label "${MODULE}@${TAG}" \\`,
              `    --release-url "https://github.com/KIParla/${MODULE}/releases/tag/${TAG}"`,
              "  ```",
            ].join("\n");
            await fileRegenerateItem(github, context, core, {
              label: process.env.REGENERATE_LABEL,
              assignee: process.env.REGENERATE_ASSIGNEE,
              item,
            });
